<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Vue</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>

  <body>
    <div id="app">
      <div v-if="isSeen">true일때 보여요</div>
      <div v-else>false일때 보여요</div>
      <!-- 아래와 같이 간단한 것은 작성할 수 있으나 비권장 -->
      <button @click="isSeen = !isSeen">토글</button>
      <hr>
      <div v-if="name === 'Yang'">양</div>
      <div v-else-if="name === 'Kim'">김</div>
      <div v-else-if="name === 'Park'">박</div>
      <div v-else>아무개</div>
      <hr>
      <template v-if="name === 'bot'">
        <div>로보트입니다.</div>
        <div>AI 기능이 있지요</div>
      </template>
      <hr>
      <div v-show="isShow">
        이것은 보이나요?
      </div>


    </div>

    <script>
      const { createApp, ref } = Vue;

      const app = createApp({
        setup() {
          const isSeen = ref(false);
          const name = ref("bot");
          const isShow = ref(false);
          return {
            isSeen,
            name,
            isShow
          };
        },
      });
      app.mount("#app");
    </script>
  </body>
</html>
