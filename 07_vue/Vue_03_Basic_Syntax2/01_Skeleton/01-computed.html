<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Vue</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>

  <body>
    <div id="app">
      <h2>남은 할 일</h2>
    </div>

    <script>
      // 코드를 자유롭게 작성하세용
      const { createApp, ref } = Vue;

      const app = createApp({
        setup() {
          const todos = ref([
            { text: "Vue 공부하기" },
            { text: "Vue 실습하기" },
            { text: "밥먹기" },
          ]);

          // computed를 사용해서 표현해보기

          // 함수 생성해서 사용해보기

          return {
            todos,
          };
        },
      });

      app.mount("#app");
    </script>
  </body>
</html>
